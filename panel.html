<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панель управления</title>
<style>
  :root{--bg:#0a0f1a;--card:#121a2a;--border:#00d4ff;--text:#e8e8f0;--dim:#8a95a8;--ok:#22c55e;--err:#ff6b6b}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);padding:2rem;max-width:960px;margin:0 auto}
  .nav{position:sticky;top:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 2rem;margin-bottom:1.5rem;box-shadow:0 4px 20px rgba(0,212,255,0.08)}
  .nav-inner{display:flex;gap:1.5rem}
  .nav-inner a{color:var(--dim);text-decoration:none;font-size:0.95rem}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.8rem;margin-bottom:1.8rem;box-shadow:0 4px 24px rgba(0,212,255,0.06)}
  .panel h2{color:var(--accent);margin-bottom:1.2rem;display:flex;align-items:center;gap:0.6rem}
  .panel h2::before{content:"";display:inline-block;width:6px;height:18px;background:var(--border);border-radius:3px}

  .f{margin-bottom:1rem}
  .f label{display:block;font-size:0.9rem;color:var(--dim);margin-bottom:0.35rem}
  .f input,.f textarea{width:100%;padding:11px 13px;border:1px solid #334455;border-radius:12px;background:#0a0a0a;color:#e8e8f0;font-size:1rem}
  .f input:focus,.f textarea:focus{outline:none;border-color:var(--border)}
  .f textarea{height:150px;resize:vertical}

  .btns{display:flex;gap:1rem;margin-top:1rem}
  .btn{padding:12px 22px;border:none;border-radius:12px;background:var(--accent);color:#05050a;font-size:1rem;cursor:pointer;transition:opacity 0.15s}
  .btn:hover{opacity:0.9}
  .btn-secondary{background:rgba(0,212,255,0.15);color:var(--accent)}

  .status{padding:10px 14px;border-radius:10px;font-size:0.9rem;margin-top:0.6rem;display:none}
  .status.ok{background:rgba(34,167,102,0.15);color:var(--ok);border:1px solid var(--ok)}
  .status.err{background:rgba(255,107,107,0.15);color:var(--err);border:1px solid var(--err)}

  .flag{display:flex;align-items:center;gap:0.8rem;margin-top:1.2rem;font-size:0.95rem}
  .flag .dot{width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid #05050a}
</style>
</head>
<body>

<nav class="nav"><div class="nav-inner"><a href="index.html">Главная</a></div></nav>

<div class="panel">
  <h2>Глобальные новости</h2>
  <div class="f"><label>Заголовок</label><input type="text" id="pTitle"></div>
  <div class="f"><label>Текст</label><textarea id="pText"></textarea></div>
  <div class="f"><label>Категория</label><select id="pCat"><option value="Событие">Событие</option><option value="СМИ">СМИ</option><option value="Обновление">Обновление</option></select></div>
  <div class="btns">
    <button class="btn" onclick="publish()">Опубликовать</button>
    <div class="status" id="s1"></div>
  </div>
</div>

<div class="panel">
  <h2>Роли</h2>
  <div class="f">
    <label>Имя игрока</label>
    <input type="text" id="rName" placeholder="sl1fer">
  </div>
  <div class="f">
    <label>Роль</label>
    <select id="rRole"><option value="owner">Владелец</option><option value="media">СМИ</option><option value="user">Игрок</option></select>
  </div>
  <div class="btns">
    <button class="btn" onclick="setRole()">Выдать роль</button>
    <div class="status" id="s2"></div>
  </div>
</div>

<div class="flag" id="flagArea">
  <span id="flagText">—</span>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';
import { getFirestore, collection, query, doc, setDoc, addDoc } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';

const firebaseConfig = { /* реальные данные */ };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(user => {
  if (!user) {
    document.body.innerHTML = `<p>Войти: email <input id="ue" placeholder="email"> password <input id="up" type="password"> <button class="btn" onclick="doLogin()">Войти</button></p>`;
    return;
  }

  const uid = user.uid;
  const uDoc = doc(db,'users',uid);
  getDocs(query(collection(db,'users'), where('uid','==',uid))).then(snap => {
    const info = snap.docs[0]?.data() || {display:'(нет)',role:'user'};
    const display = info.display || '(нет)';
    const role = info.role || 'user';

    // Галочка
    const flagText = document.getElementById('flagText');
    if(display === 'sl1fer' && role === 'owner'){
      flagText.innerHTML = `<span class="ok">✓ sl1fer — ВЛАДЕЛЕЦ</span><span class="dot"></span>`;
    } else if(display === 'sl1fer'){
      flagText.innerHTML = `<span class="err">sl1fer — ${role} (не владелец)</span><span class="dot"></span>`;
    } else {
      flagText.innerHTML = `<span class="dim">${display} — ${role}</span><span class="dot"></span>`;
    }

    const editor = document.querySelector('.panel:first-child');
    const mgmt = document.querySelector('.panel:nth-child(2)');

    const isOwner = (role === 'owner');
    const isMedia = (role === 'media');

    if(!isOwner && !isMedia){
      editor.innerHTML = `<div class="empty" style="border-color:#ff6b6b">Нет доступа. Роль: ${role}</div>`;
    } else {
      const btns = editor.querySelector('.btns');
      if(btns) btns.style.display = 'flex';
    }

    if(!isOwner){
      mgmt.querySelector('h2').innerHTML = 'Роли: только владелец';
      mgmt.querySelectorAll('input').forEach(i=>i.disabled=true);
      mgmt.querySelector('.btn').disabled=true;
    }

    function doLogin(){ signInWithEmailAndPassword(auth,document.getElementById('ue').value,document.getElementById('up').value).then(()=>location.href='panel.html').catch(x=>alert(x.message)); }

    function publish(){
      if(!isOwner && !isMedia) return;
      const t=document.getElementById('pTitle').value.trim(), c=document.getElementById('pText').value.trim(), cat=document.getElementById('pCat').value;
      if(!t||!c){ show('Заполни заголовок и текст','err'); return; }
      addDoc(collection(db,'news'),{title:t,content:c,category:cat,author:display,published:true,authorId:uid,createdAt:new Date().toISOString()})
        .then(()=>{ show('Опубликовано. Глобальная лента.', 'ok'); document.getElementById('pTitle').value=''; document.getElementById('pText').value=''; })
        .catch(x=>show('Ошибка: '+x.message,'err'));
    }

    function setRole(){
      if(!isOwner) return;
      const name=document.getElementById('rName').value.trim(), role=document.getElementById('rRole').value;
      if(!name||!role){ show('Заполни поля','err'); return; }
      getDocs(query(collection(db,'users'), where('display','==',name))).then(snap => {
        if(!snap.docs.length){ show('Не найдено','err'); return; }
        setDoc(snap.docs[0], {role:role}).then(()=>show('Готово.', 'ok'));
      }).catch(x=>show(x.message,'err'));
    }

    function show(txt,cls){ const s=document.getElementById('s2'); s.textContent=txt; s.className='status '+cls; s.style.display='block'; setTimeout(()=>s.style.display='none',3000); }
  });
</script>
</body>
</html>
