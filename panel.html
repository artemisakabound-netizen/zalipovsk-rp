<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панель управления</title>
<style>
  :root{--bg:#070710;--deep:#05050a;--accent:#00d4ff;--text:#e8e8f0;--dim:#8a95a8;--ok:#22c55e;--err:#ff6b6b}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--deep);color:var(--text);padding:2.5rem;max-width:960px;margin:0 auto}
  .hero-bg{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#1a1a2e 0%,#0d0d1f 50%,#05050a 100%);background-size:400% 400%;animation:move 15s ease-in-out infinite}
  @keyframes move{0%{left:20%}100%{left:-20%}}

  .nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,0.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:1.2rem 2rem;margin-bottom:2rem;box-shadow:0 8px 32px rgba(0,0,0,0.25)}
  .nav-inner{display:flex;gap:1.4rem}
  .nav-inner a{color:var(--dim);text-decoration:none;font-size:0.95rem}

  .panel{background:rgba(255,255,255,0.06);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:2rem;margin-bottom:2rem;box-shadow:0 8px 32px rgba(0,0,0,0.25)}
  .panel h2{color:var(--accent);margin-bottom:1.2rem;display:flex;align-items:center;gap:0.6rem}

  .f{margin-bottom:1rem}
  .f label{display:block;font-size:0.85rem;color:var(--dim);margin-bottom:0.35rem}
  .f input,.f textarea{width:100%;padding:13px 15px;border:1px solid rgba(255,255,255,0.15);border-radius:18px;background:rgba(255,255,255,0.05);color:#e8e8f0;font-size:1rem}
  .f input:focus,.f textarea:focus{outline:none;border-color:var(--accent)}
  .f textarea{height:160px;resize:vertical}

  .btns{display:flex;gap:1rem;margin-top:1rem}
  .btn{padding:13px 26px;border:none;border-radius:24px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05050a;font-size:1rem;cursor:pointer;transition:opacity 0.15s,transform 0.15s}
  .btn:hover{opacity:0.95}
  .status{padding:12px 16px;border-radius:18px;font-size:0.9rem;margin-top:0.6rem;display:none}
  .status.ok{background:rgba(34,167,102,0.15);color:var(--ok);border:1px solid var(--ok)}
  .status.err{background:rgba(255,107,107,0.15);color:var(--err);border:1px solid var(--err)}

  .flag{display:flex;align-items:center;gap:1rem;margin-top:1.5rem;font-size:1rem}
  .flag .dot{width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid #05050a;flex-shrink:0}
</style>
</head>
<body>

<div class="hero-bg"></div>
<nav class="nav"><div class="nav-inner"><a href="index.html">Главная</a></div></nav>

<div class="panel">
  <h2>Новая глобальная новость</h2>
  <div class="f"><label>Заголовок</label><input type="text" id="pTitle"></div>
  <div class="f"><label>Текст</label><textarea id="pText"></textarea></div>
  <div class="f"><label>Категория</label><select id="pCat"><option value="Событие">Событие</option><option value="СМИ">СМИ</option><option value="Обновление">Обновление</option></select></div>
  <div class="btns">
    <button class="btn" onclick="publish()">Опубликовать</button>
    <div class="status" id="s1"></div>
  </div>
</div>

<div class="panel">
  <h2>Роли</h2>
  <div class="f"><label>Имя игрока</label><input type="text" id="rName" placeholder="sl1fer"></div>
  <div class="f"><label>Роль</label><select id="rRole"><option value="owner">Владелец</option><option value="media">СМИ</option><option value="user">Игрок</option></select></div>
  <div class="btns">
    <button class="btn" onclick="setRole()">Выдать роль</button>
    <div class="status" id="s2"></div>
  </div>
</div>

<div class="flag" id="flagArea">
  <span id="flagText">—</span>
  <span class="dot"></span>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';
import { getFirestore, collection, query, doc, setDoc, addDoc } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';

const firebaseConfig = { /* реальные данные */ };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(user => {
  if (!user) {
    document.body.innerHTML = `<p>Войти: email <input id="ue" placeholder="email"> password <input id="up" type="password"> <button class="btn" onclick="doLogin()">Войти</button></p>`;
    return;
  }

  const uid = user.uid;
  getDocs(query(collection(db,'users'), where('uid','==',uid))).then(snap => {
    const info = snap.docs[0]?.data() || {display:'(нет)',role:'user'};
    const display = info.display || '(нет)';
    const role = info.role || 'user';

    const flagText = document.getElementById('flagText');
    if(display === 'sl1fer' && role === 'owner'){
      flagText.innerHTML = `<span style="color:#22c55e;font-weight:700">✓ sl1fer — Владелец</span>`;
      document.getElementById('flagArea').querySelectorAll('.dot')[0].style.background = '#22c55e';
    } else if(display === 'sl1fer'){
      flagText.innerHTML = `<span style="color:#ff6b6b;font-weight:700">sl1fer — ${role} (не владелец)</span>`;
      document.getElementById('flagArea').querySelectorAll('.dot')[0].style.background = '#ff6b6b';
    } else {
      flagText.innerHTML = `<span style="color:var(--dim)">${display} — ${role}</span>`;
      document.getElementById('flagArea').querySelectorAll('.dot')[0].style.background = '#8a95a8';
    }

    const editor = document.querySelector('.panel:first-child');
    const mgmt = document.querySelector('.panel:nth-child(2)');
    const isOwner = (role === 'owner');
    const isMedia = (role === 'media');

    if(!isOwner && !isMedia){
      editor.innerHTML = `<div style="color:#ff6b6b;padding:1.6rem;border-radius:24px;border:1px solid rgba(255,107,107,0.3);background:rgba(255,107,107,0.08)">Нет доступа. Роль: ${role}</div>`;
    }

    if(!isOwner){
      mgmt.querySelectorAll('input').forEach(i=>i.disabled=true);
      mgmt.querySelector('.btn').disabled=true;
      mgmt.querySelector('h2').innerHTML = 'Роли: только владелец';
    }

    function doLogin(){ signInWithEmailAndPassword(auth,document.getElementById('ue').value,document.getElementById('up').value).then(()=>location.href='panel.html').catch(x=>alert(x.message)); }

    function publish(){
      if(!isOwner && !isMedia) return;
      const t=document.getElementById('pTitle').value.trim(), c=document.getElementById('pText').value.trim(), cat=document.getElementById('pCat').value;
      if(!t||!c){ show('Заполни заголовок и текст','err'); return; }
      addDoc(collection(db,'news'),{title:t,content:c,category:cat,author:display,published:true,authorId:uid,createdAt:new Date().toISOString()})
        .then(()=>{ show('Опубликовано. Глобальная лента.', 'ok'); document.getElementById('pTitle').value=''; document.getElementById('pText').value=''; })
        .catch(x=>show('Ошибка: '+x.message,'err'));
    }

    function setRole(){
      if(!isOwner) return;
      const name=document.getElementById('rName').value.trim(), role=document.getElementById('rRole').value;
      if(!name||!role){ show('Заполни поля','err'); return; }
      getDocs(query(collection(db,'users'), where('display','==',name))).then(snap => {
        if(!snap.docs.length){ show('Не найдено','err'); return; }
        setDoc(snap.docs[0], {role:role}).then(()=>show('Готово.', 'ok'));
      }).catch(x=>show(x.message,'err'));
    }

    function show(txt,cls){ const s=document.getElementById('s2'); s.textContent=txt; s.className='status '+cls; s.style.display='block'; setTimeout(()=>s.style.display='none',3000); }
  });
</script>
</body>
</html>
