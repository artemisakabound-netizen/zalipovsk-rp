<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Залиповский вестник</title>
<style>
  :root{
    --bg:#070710;
    --deep:#05050a;
    --accent:#00d4ff;
    --accent2:#38bdf8;
    --text:#e8e8f0;
    --dim:#8a95a8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--deep);color:var(--text);font-family:'Segoe UI',Tahoma,sans-serif;padding:2.5rem}

  .hero-bg{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#1a1a2e 0%,#0d0d1f 50%,#05050a 100%);background-size:400% 400%;animation:move 15s ease-in-out infinite}
  @keyframes move{0%{left:20%}100%{left:-20%}}

  .nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,0.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:1.2rem 2rem;margin-bottom:2.5rem;box-shadow:0 8px 32px rgba(0,0,0,0.25)}
  .nav-inner{display:flex;gap:1.8rem;align-items:center;flex-wrap:wrap}
  .logo{font-size:1.55rem;font-weight:800;color:var(--accent);letter-spacing:-0.03em}
  .nav-links{list-style:none;display:flex;gap:1.4rem}
  .nav-links a{color:var(--dim);text-decoration:none;font-size:0.95rem}
  .nav-links a:hover{color:var(--accent)}

  .hero{max-width:960px;margin:0 auto;text-align:center}
  .hero h1{font-size:2.9rem;color:var(--accent);margin-bottom:0.5rem}
  .hero p{color:var(--dim);font-size:1.05rem;margin-top:0.4rem}

  .card{background:rgba(255,255,255,0.07);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(0,212,255,0.18);border-radius:24px;padding:1.8rem;margin-bottom:1.6rem;transition:transform 0.25s,box-shadow 0.25s,border-color 0.2s}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,212,255,0.12);border-color:rgba(0,212,255,0.35)}
  .card h3{color:var(--text);font-size:1.35rem;margin-bottom:0.6rem}
  .card p{color:#c0c0d0;font-size:1rem;line-height:1.6;margin-top:0.4rem}
  .card .meta{color:var(--dim);font-size:0.82rem;margin-bottom:0.5rem}

  .empty{border:1px solid rgba(0,212,255,0.25);border-radius:24px;padding:3rem;text-align:center;color:var(--dim);font-size:1.05rem}

  .actions{display:flex;gap:1rem;margin-top:2.5rem;flex-wrap:wrap}
  .btn{padding:14px 28px;border:none;border-radius:24px;color:#05050a;font-size:1rem;cursor:pointer;transition:opacity 0.15s,transform 0.15s}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;box-shadow:0 4px 20px rgba(0,212,255,0.35)}
  .btn-primary:hover{opacity:0.9}
  .btn-secondary{background:rgba(255,255,255,0.08);border:1px solid rgba(0,212,255,0.25);color:var(--text)}
  .btn-secondary:hover{background:rgba(255,255,255,0.14)}

  @media (max-width:640px){
    .hero h1{font-size:2.1rem}
    .nav-inner{flex-direction:column;gap:1rem}
    body{padding:1.5rem}
  }
</style>
</head>
<body>

<div class="hero-bg"></div>

<nav class="nav">
  <div class="nav-inner">
    <div class="logo">Залиповский вестник</div>
    <ul class="nav-links">
      <li><a href="index.html">Главная</a></li>
      <li><a href="news.html">Новости</a></li>
      <li><a href="panel.html">Панель</a></li>
    </ul>
  </div>
</nav>

<main class="page">
  <section class="hero">
    <h1>Залиповский вестник</h1>
    <p>Глобальная лента ролевого проекта. Публикации: редакция СМИ и администрация.</p>
  </section>

  <section class="feed" id="feed"></section>

  <section class="actions">
    <button class="btn btn-primary" onclick="window.open('https://www.roblox.com/games/125350055595066/Zarechensk-RP','_blank')">Играть</button>
    <button class="btn btn-secondary" onclick="window.open('https://discord.gg/3VEQvRupk','_blank')">Discord</button>
  </section>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';
import { getFirestore, collection, query, getDocs } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "имя-проекта.firebaseapp.com",
  projectId: "имя-проекта",
  storageBucket: "имя-проекта.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const feed = document.getElementById('feed');

onAuthStateChanged(user => {
  if (!user) {
    feed.innerHTML = `
      <div class="empty">
        <p>Для работы нужно войти.</p>
        <div style="margin-top:1.2rem;display:flex;gap:0.7rem;flex-wrap:wrap">
          <input id="ie" placeholder="Email" style="padding:11px;border:1px solid #334455;border-radius:12px;background:#070710;color:#e8e8f0;width:240px;font-size:1rem">
          <input id="ip" type="password" placeholder="Пароль" style="padding:11px;border:1px solid #334455;border-radius:12px;background:#070710;color:#e8e8f0;width:240px;font-size:1rem">
          <button class="btn btn-primary" onclick="doLogin()">Войти</button>
        </div>
      </div>`;
    return;
  }

  const q = query(collection(db,'news'), where('published','==',true));
  getDocs(q).then(snap => {
    if (!snap.docs.length) { feed.innerHTML = '<div class="empty">Глобальных новостей пока нет.</div>'; return; }
    feed.innerHTML = snap.docs.map(d => {
      const data = d.data();
      const dt = new Date(data.createdAt).toLocaleDateString('ru-RU');
      const c = data.content.substring(0,150) + (data.content.length>150?'…':'');
      return `<div class="news-card"><div class="meta">${dt} • ${data.author}</div><h3>${data.title}</h3><p>${c}</p></div>`;
    }).join('');
  });
});

function doLogin(){
  signInWithEmailAndPassword(auth,document.getElementById('ie').value,document.getElementById('ip').value)
    .then(()=>location.href='index.html')
    .catch(x=>alert(x.message));
}
</script>
</body>
</html>
